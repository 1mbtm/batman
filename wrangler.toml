name = "arqam-portfolio"
pages_build_output_dir = "dist"
compatibility_date = "2025-01-01"

[vars]
ANALYTICS_RETENTION_DAYS = "90"
ALLOWED_ORIGIN = "https://batman-7y3.pages.dev"

# ============================================================================
# Cloudflare D1 Database Binding Setup (Optional for Persistent Cloud Storage)
# ============================================================================
# 1. Create your D1 database in your Cloudflare account:
#      npx wrangler d1 create arqam-portfolio-analytics
#
# 2. For Cloudflare Pages Production Deployment:
#    Bind D1 in Cloudflare Dashboard -> Workers & Pages -> batman -> Settings
#    -> Functions -> D1 database bindings:
#      Variable name: DB
#      D1 database:   arqam-portfolio-analytics
#
# [[d1_databases]]
# binding = "DB"
# database_name = "arqam-portfolio-analytics"
# database_id = "<PASTE_YOUR_D1_DATABASE_UUID_HERE>"
# migrations_dir = "migrations"
